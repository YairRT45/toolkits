{% extends 'base.html' %}

{% block title %}Confirmar eliminación{% endblock %}

{% block content %}
<div class="breadcrumb">
    <a href="{% url 'listar_toolkits' %}">Toolkits</a>
    <span>/</span>
    <span>Eliminar</span>
</div>

<div class="card" style="max-width:500px;margin:40px auto;text-align:center;">
    <i class="fa-solid fa-triangle-exclamation" style="font-size:48px;color:#d4a017;margin-bottom:20px;"></i>
    <h1 style="font-size:24px;margin-bottom:12px;">¿Eliminar {{ tipo }}?</h1>
    <p style="color:#8c8d8f;margin-bottom:28px;">
        Se eliminará <strong>{{ objeto }}</strong> y toda su información asociada. Esta acción no se puede deshacer.
    </p>
    <form method="post" class="form-actions" style="justify-content:center;">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirmar eliminación</button>
        <a href="{% url 'listar_toolkits' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
